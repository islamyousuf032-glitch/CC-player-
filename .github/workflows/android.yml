name: Android verification

on:
  push:
    branches:
      - arena/dc3af5e9-cc-player
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and native toolchain
        run: |
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew :core:media:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee "${RUNNER_TEMP}/cc-player-build.log"

      - name: Publish failure diagnostics
        if: failure()
        run: |
          {
            echo "## Build diagnostics"
            echo
            echo '```text'
            if [[ -f "${RUNNER_TEMP}/cc-player-build.log" ]]; then
              tail -n 250 "${RUNNER_TEMP}/cc-player-build.log"
            else
              echo "The build did not reach Gradle; inspect the SDK setup step."
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cc-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-player-test-reports
          path: core/media/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
