name: Android verification

on:
  push:
    branches:
      - arena/dc3af5e9-cc-player
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform and native toolchain
        run: |
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.31.6"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew :core:media:testDebugUnitTest :app:assembleDebug --console=plain 2>&1 | tee "${RUNNER_TEMP}/cc-player-build.log"

      - name: Publish failure diagnostics
        if: failure()
        run: |
          {
            echo "## Build diagnostics"
            echo
            echo '```text'
            if [[ -f "${RUNNER_TEMP}/cc-player-build.log" ]]; then
              tail -n 250 "${RUNNER_TEMP}/cc-player-build.log"
            else
              echo "The build did not reach Gradle; inspect the SDK setup step."
            fi
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload failed build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cc-player-failed-build-log
          path: ${{ runner.temp }}/cc-player-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify APK contents and signature
        run: |
          python3 - <<'PY'
          import zipfile
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          required = {
              "THIRD_PARTY_NOTICES.md",
              "licenses/MotionCam-Decoder-LICENSE.txt",
              "licenses/nlohmann-json-LICENSE.txt",
              "licenses/SIMDe-LICENSE.txt",
              *{f"lib/{abi}/libccplayer_mcraw.so" for abi in ("arm64-v8a", "x86_64")},
              *{f"lib/{abi}/libc++_shared.so" for abi in ("arm64-v8a", "x86_64")},
          }
          with zipfile.ZipFile(apk) as package:
              missing = sorted(required - set(package.namelist()))
          if missing:
              raise SystemExit("APK is missing required entries: " + ", ".join(missing))
          print(f"Verified {len(required)} required native/license APK entries.")
          PY
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cc-player-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-player-test-reports
          path: core/media/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7
